function dashboard(){let a=totalAssets(),d=totalDebts(),i=income(),e=expense(),g=state.goals[0];const tiles={net:`<div class="tile-head"><span class="eyebrow">NET WORTH / 淨資產</span><span class="eyebrow">TWD</span></div><div class="num"><small>NT$</small>${money(a-d)}</div><div class="change">${state.demo?'你的財務全貌，集中在這裡。':'依目前資產與負債快照計算'}</div>${state.demo?chart():'<div class="note">開始累積資產快照後，即可建立歷史趨勢。</div>'}`,asset:`<h2>總資產</h2><div class="eyebrow">TOTAL ASSETS</div><div class="statnum num">${money(a)}</div><div class="sub">${state.assets.length} 種資產類別</div>`,debt:`<h2>總負債</h2><div class="eyebrow">LIABILITIES</div><div class="statnum num">${money(d)}</div><div class="sub">${state.debts.length} 筆負債</div>`,income:`<h2>本月收入</h2><div class="eyebrow">MONEY IN</div><div class="statnum num">${money(i)}</div><div class="sub">${state.month} · 已覆核交易</div>`,expense:`<h2>本月支出</h2><div class="eyebrow">MONEY OUT</div><div class="statnum num">${money(e)}</div><div class="sub">轉帳與繳卡費不重複計入</div>`,savings:`<div class="tile-head"><h2>每一筆，留給未來</h2><span class="eyebrow">SAVINGS</span></div><div class="statnum num">${i?((i-e)/i*100).toFixed(1):'—'}<small style="font-size:14px"> %</small></div><div class="sub">本月儲蓄率 · 結餘 NT$ ${money(i-e)}</div>`,pending:`<div class="tile-head"><h2>下一筆應繳</h2><span class="eyebrow">UP NEXT ↗</span></div><div class="statnum num">${money(state.debts[0]?.payment||0)}</div><div class="sub">${esc(state.debts[0]?.name||'目前沒有帳款')} · ${esc(state.debts[0]?.due||'—')}</div>`,goal:`<div class="tile-head"><h2>${esc(g?.name||'設定你的第一個目標')}</h2><span class="eyebrow">GOAL</span></div><div style="display:flex;justify-content:space-between"><span class="num">${money(g?.saved||0)}</span><span class="tiny">/ ${money(g?.target||0)}</span></div><div class="progress"><i style="width:${g?Math.min(100,g.saved/g.target*100):0}%"></i></div><div class="tiny">${g?Math.round(g.saved/g.target*100):0}% 達成 · 穩穩向前</div>`};return top('看見你的財務全貌。','THE BIG PICTURE','少一點整理，多一點掌握。',monthSelect()+'<button class="btn" id="customize">⊞ 自訂面板</button><button class="btn primary" data-go="upload">＋ 匯入帳單</button>')+`<div class="strip"><span><span class="tag">${state.demo?'示範工作區':'個人工作區'}</span>${state.demo?'目前顯示示範資產與交易；淨值曲線為示意。':'資料保存在此裝置；帳單入帳不會自動更改資產快照。'}</span><button class="textbtn" data-go="settings">管理資料 ↗</button></div><div class="bento" id="bento">${state.widgets.filter(k=>!state.hidden.includes(k)).map(k=>`<section class="tile widget ${k} ${k==='net'?'yellow':k==='asset'?'blue':k==='debt'?'red':''}" draggable="true" data-widget="${k}" aria-label="${k} 模組，可拖拉排序">${tiles[k]}</section>`).join('')}</div><div class="lower"><section class="panel"><div class="section-head"><h2>錢，放在哪裡？</h2><button class="textbtn" data-go="portfolio">檢視配置 ↗</button></div>${allocation()}<div class="tiny muted">以新台幣計價 · 手動資產快照</div></section><section class="panel"><div class="section-head"><h2>這個月的流動</h2><span class="eyebrow">CASH FLOW</span></div><div class="bars">${cashbars()}</div><div class="legend-row"><span class="swatch" style="background:var(--blue)"></span>收入<span class="swatch" style="background:var(--yellow);margin-left:12px"></span>支出<strong>TWD</strong></div><div class="tiny muted" style="margin-top:15px">依已覆核交易計算；無交易的月份顯示為零。</div></section></div><div class="section-head"><h2>最近的每一筆</h2><button class="textbtn" data-go="transactions">全部交易 ↗</button></div>${table(period().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5))}`}
function cashbars(){let rows=Array.from({length:6},(_,idx)=>{let dt=new Date(state.month+'-01T12:00:00');dt.setMonth(dt.getMonth()-5+idx);let m=dt.toISOString().slice(0,7),ts=state.transactions.filter(t=>t.date.startsWith(m)&&counted(t));return [m,ts.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0),-ts.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0)]}),max=Math.max(1,...rows.flatMap(r=>r.slice(1)));return rows.map(r=>`<div class="bar-pair" title="${r[0]} 收入 ${money(r[1])}／支出 ${money(r[2])}"><i style="height:${r[1]/max*88}%"></i><i style="height:${r[2]/max*88}%"></i><span class="mono">${r[0].slice(5)}月</span></div>`).join('')}
function allocation(){const total=totalAssets();let sum=0,stops=state.assets.map(a=>{let start=sum;sum+=total?a.value/total*100:0;return `${a.color} ${start}% ${sum}%`});return `<div class="allocation"><div class="donut" style="background:${total?'conic-gradient('+stops.join(',')+')':'#ddd'}" role="img" aria-label="資產配置比例"><span class="donut-center mono">${total?'100%':'0%'}</span></div><div class="legend">${state.assets.map(a=>`<div class="legend-row"><i class="swatch" style="background:${a.color}"></i>${esc(a.name)}<strong>${total?(a.value/total*100).toFixed(1):'0'}%</strong></div>`).join('')}</div></div>`}
function table(rows,edit=false){return `<div class="tablewrap"><table><thead><tr><th>DATE / 日期</th><th>DESCRIPTION / 交易摘要</th><th>分類</th><th>來源</th><th style="text-align:right">AMOUNT / TWD</th>${edit?'<th>操作</th>':''}</tr></thead><tbody>${rows.map(t=>`<tr><td class="mono">${esc(t.date)}</td><td class="merchant">${esc(t.name)}</td><td><span class="badge">${esc(t.category)}</span></td><td><button class="textbtn" data-source="${esc(t.id)}">${esc(t.source)}</button></td><td class="amount">${t.amount>0?'+':'−'}${money(Math.abs(t.amount))}</td>${edit?`<td><button class="textbtn" data-edit="${esc(t.id)}">編輯</button></td>`:''}</tr>`).join('')||'<tr><td colspan="6" class="empty">這個範圍還沒有交易。匯入帳單，開始整理。</td></tr>'}</tbody></table></div>`}
function upload(){return top('把帳單，交給這裡。','DOCUMENT INBOX','先匯入，再覆核。確認後的交易才會計入儀表板。','<button class="btn" id="sample">下載 CSV 範本 ↓</button>')+`<div class="upload-zone" id="drop" tabindex="0" role="button" aria-label="選擇或拖曳帳單檔案"><div class="upload-icon">↥</div><h2>拖曳帳單到這裡</h2><p>或點擊選擇檔案 · 可一次選取多份<br>CSV 可直接解析；PDF／圖片需 OCR 服務</p><span class="btn primary">選擇檔案 ＋</span></div><div class="note">目前支援本地 CSV 解析、分類與重複交易檢查。PDF／圖片不會上傳；尚未啟用 OCR，因此不會產生辨識結果。<br>CSV 欄位：date、description、amount、category（選填）。收入填正數，支出填負數。</div>${review.length?reviewTable():''}<div class="section-head" style="margin-top:28px"><h2>匯入紀錄</h2><span class="eyebrow">IMPORT HISTORY</span></div>${state.imports.length?state.imports.map(i=>`<div class="legend-row"><span>${esc(i.name)}</span><strong>${i.count} 筆 · ${esc(i.date)}</strong></div>`).join(''):'<div class="panel empty">還沒有匯入紀錄。<br><button class="textbtn" id="trySample">先試試範例 CSV ↗</button></div>'}`}
function reviewTable(){return `<div class="section-head" style="margin-top:30px"><h2>覆核 ${review.length} 筆交易</h2><button class="btn primary" id="commit">確認入帳 →</button></div><p class="tiny muted">黃色標籤代表疑似重複，預設不入帳；可以勾選保留。修改後按「確認入帳」會重新檢查欄位。</p><div class="tablewrap review"><table><thead><tr><th>保留</th><th>日期</th><th>摘要</th><th>金額</th><th>分類</th><th>狀態</th></tr></thead><tbody>${review.map((r,i)=>`<tr><td><input type="checkbox" aria-label="保留第 ${i+1} 筆" data-r="${i}" data-f="keep" ${r.keep?'checked':''}></td><td><input type="date" data-r="${i}" data-f="date" value="${esc(r.date)}" aria-label="交易日期"></td><td><input class="wide" data-r="${i}" data-f="name" value="${esc(r.name)}" aria-label="交易摘要"></td><td><input type="number" step="0.01" data-r="${i}" data-f="amount" value="${r.amount}" aria-label="交易金額"></td><td><select data-r="${i}" data-f="category" aria-label="交易分類">${categories.map(c=>`<option ${r.category===c?'selected':''}>${c}</option>`).join('')}</select></td><td><span class="badge ${r.duplicate?'pending':''}">${r.duplicate?'疑似重複':'待覆核'}</span></td></tr>`).join('')}</tbody></table></div>`}
function transactions(){let rows=period().filter(t=>(!query||(t.name+' '+t.source+' '+t.category).toLowerCase().includes(query.toLowerCase()))&&(filter==='all'||t.category===filter)).sort((a,b)=>b.date.localeCompare(a.date));return top('每一筆，都有來處。','TRANSACTION LEDGER','搜尋、調整分類，回查交易來源。',monthSelect()+'<button class="btn" id="exportCSV">匯出本月 CSV ↓</button><button class="btn primary" id="addTx">＋ 新增交易</button>')+`<div class="filterbar"><input id="search" placeholder="搜尋交易、分類或來源" value="${esc(query)}" aria-label="搜尋交易"><select id="categoryFilter" aria-label="篩選分類"><option value="all">全部分類</option>${categories.map(c=>`<option ${filter===c?'selected':''}>${c}</option>`).join('')}</select><span class="badge" style="align-self:center">${rows.length} 筆</span></div><div id="txTable">${table(rows,true)}</div>`}
function portfolio(){let total=totalAssets();return top('讓配置，回到你的節奏。','PORTFOLIO & BALANCE','依你設定的目標比例試算，不涉及自動買賣。','<button class="btn primary" id="editAssets">編輯資產快照</button>')+`<div class="metrics"><div><span class="eyebrow">TOTAL ASSETS / 總資產</span><strong class="num">${money(total)}</strong></div><div><span class="eyebrow">ASSET CLASSES / 資產類別</span><strong class="num">${state.assets.length.toString().padStart(2,'0')}</strong></div><div><span class="eyebrow">BASE CURRENCY / 計價幣別</span><strong class="num">TWD</strong></div></div><div class="split"><section class="panel"><div class="section-head"><h2>目前資產配置</h2><span class="eyebrow">ALLOCATION</span></div>${allocation()}<div class="holding-list">${state.assets.map(a=>`<div class="row"><div><h3>${esc(a.name)}</h3><span class="tiny muted">手動快照 · 無即時行情</span></div><strong class="num">${money(a.value)}</strong></div>`).join('')}</div></section><section class="panel"><div class="section-head"><h2>你的理想比例</h2><span class="eyebrow">TARGET MIX</span></div><p class="sub muted">調整各類目標，合計必須為 100%。</p><form id="targets">${state.assets.map((a,i)=>`<div class="target-row"><label for="target${i}">${esc(a.name)}</label><div><input id="target${i}" type="number" min="0" max="100" step="0.1" value="${a.target}" required aria-label="${esc(a.name)}目標百分比"></div><span class="num">${money(total*a.target/100-a.value)>0?'+':''}${money(total*a.target/100-a.value)}</span></div>`).join('')}<p class="tiny muted">右側為目標金額減去目前金額；正數表示需增加，負數表示需減少。</p><p id="targetError" class="error"></p><button class="btn primary" type="submit">儲存並重新試算 →</button></form><div class="note">試算以現有總資產不變為前提，未納入稅費、匯差與交易成本；不代表個人投資建議。</div></section></div>`}
function debts(){return top('先安穩，再往前。','LIABILITIES & GOALS','把該繳的、想存的，一起放進計畫。','<button class="btn primary" id="editDebt">編輯負債</button>')+`<div class="split"><section class="panel"><div class="section-head"><h2>負債與應繳款</h2><span class="eyebrow">PAYMENTS</span></div><div class="holding-list">${state.debts.map(d=>`<div class="row"><div><h3>${esc(d.name)}</h3><div class="tiny muted">到期 ${esc(d.due)} · 年利率 ${d.rate}%<br>本期應繳 NT$ ${money(d.payment)}</div></div><strong class="num">${money(d.balance)}</strong></div>`).join('')||'<div class="empty">目前沒有負債</div>'}</div><div class="note">到期日只在此頁顯示；尚未啟用背景推播提醒。</div></section><section class="panel"><div class="section-head"><h2>儲蓄目標</h2><button class="textbtn" id="editGoal">編輯目標 ↗</button></div>${state.goals.map(g=>`<div style="margin:30px 0"><h3>${esc(g.name)}</h3><div class="num" style="font-size:28px">${money(g.saved)}</div><div class="progress"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><div class="sub muted">目標 NT$ ${money(g.target)} · 尚差 ${money(Math.max(0,g.target-g.saved))}</div></div>`).join('')||'<p class="empty">設定第一個儲蓄目標</p>'}</section></div>`}
function news(){return top('看市場，也看脈絡。','MARKET READING','先建立你的閱讀入口。即時新聞與持倉關聯尚未串接。')+`<div class="note">此頁是固定閱讀資源，並非今日新聞、即時報價或 AI 市場摘要。後續可串接新聞 RSS 與行情 API。</div><div class="split">${[['01 / MACRO','總體經濟，先看原始資料。','從利率與政策聲明開始理解市場變化。','美國聯準會','https://www.federalreserve.gov/'],['02 / TAIWAN','台股資訊，回到交易所。','查看市場公告、交易資訊與投資人教育資源。','臺灣證券交易所','https://www.twse.com.tw/'],['03 / CURRENCY','匯率與政策，一起閱讀。','從央行的統計與公告掌握匯率背景。','中央銀行','https://www.cbc.gov.tw/'],['04 / GLOBAL','公司消息，閱讀正式揭露。','美股持倉相關資訊可從公司公開申報文件查起。','SEC EDGAR','https://www.sec.gov/edgar/search/']].map(r=>`<article class="news-card"><span class="eyebrow">${r[0]}</span><h3>${r[1]}</h3><p class="muted">${r[2]}</p><a class="btn" href="${r[4]}" target="_blank" rel="noopener noreferrer">${r[3]} ↗</a></article>`).join('')}</div>`}
function assistant(){return top('問問你的數字。','FINANCIAL ASSISTANT','先從你已覆核的資料，找出清楚的答案。')+`<div class="note">目前為本地資料查詢助理，使用固定計算規則；尚未串接生成式 AI。回答範圍：餐飲支出、收支結餘、信用卡應繳與配置偏差。</div><section class="chat"><div class="chatlog" id="chatlog"><div class="bubble">你好，我是帳見的資料助理。\n選好月份後，問我餐飲支出、收支、帳款或配置。我會列出計算依據。</div>${chats.map(c=>`<div class="bubble ${c.role==='user'?'user':''}">${esc(c.text)}</div>`).join('')}</div><div class="chips">${['這個月餐飲花多少？','本月收支與結餘？','信用卡還有多少要繳？','資產配置偏離多少？'].map(q=>`<button class="btn small" data-ask="${q}">${q}</button>`).join('')}</div><form class="chat-input" id="chatForm">${monthSelect()}<input id="question" placeholder="問一個關於你財務的問題…" required aria-label="財務問題"><button class="btn primary">送出 ↗</button></form></section>`}
function settings(){return top('你的資料，你做主。','PREFERENCES & DATA','管理外觀、備份與示範資料。')+`<div class="split"><section class="panel"><h2>工作區偏好</h2><div class="field"><label for="theme">顯示主題</label><select id="theme"><option value="light" ${state.theme==='light'?'selected':''}>米白 / Paper</option><option value="dark" ${state.theme==='dark'?'selected':''}>深色 / Ink</option></select></div><div class="note">交易與設定保存在此瀏覽器的 localStorage。這不是加密保險箱；原始帳單不會留存，也不會自動傳送。</div><p class="sub">${state.demo?'目前含有示範資產與交易。':'目前為個人工作區。'}</p><button class="btn" id="fresh">建立空白工作區</button></section><section class="panel"><h2>備份與還原</h2><p class="sub muted">備份含交易、資產、負債、目標與版面設定，請妥善保存。</p><div class="actions" style="justify-content:start;margin-top:22px"><button class="btn primary" id="backup">匯出備份 ↓</button><button class="btn" id="restore">還原備份 ↑</button></div><div class="rule"></div><h3>示範模式</h3><p class="sub muted">重新載入範例前，請先備份自己的資料。</p><button class="btn" id="resetDemo">重設示範資料</button></section></div>`}
function openModal(html){$('#modal').innerHTML=html;$('#modal').showModal();$('#modal').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close())}const cancel='<button type="button" class="btn" data-close>取消</button>';
function bind(){document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>{let t=state.transactions.find(t=>t.id===b.dataset.source);openModal(`<div class="eyebrow">SOURCE RECORD</div><h2>這筆交易的來處</h2><p>${esc(t.name)}</p><div class="note">來源：${esc(t.source)}<br>${t.page?'來源頁碼：'+t.page+'（示範）':'來源列：'+(t.line||'手動輸入')}<br>日期：${esc(t.date)}<br>金額：NT$ ${money(t.amount)}</div><p class="sub muted">原始檔案不會留存在瀏覽器；此處保存來源檔名與列號。</p><button class="btn" data-close>關閉</button>`)});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editTx(b.dataset.edit));$('#addTx')?.addEventListener('click',()=>editTx());$('#customize')?.addEventListener('click',customize);$('#exportCSV')?.addEventListener('click',()=>exportCSV(period()));$('#sample')?.addEventListener('click',()=>download('ledger-sample.csv',sample(),'text/csv'));$('#trySample')?.addEventListener('click',()=>parseCSV(sample(),'範例交易.csv'));$('#drop')?.addEventListener('click',()=>$('#file').click());$('#drop')?.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('#file').click()}});let drop=$('#drop');if(drop){drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');handleFiles(e.dataTransfer.files)}}document.querySelectorAll('[data-r]').forEach(e=>e.onchange=()=>{review[+e.dataset.r][e.dataset.f]=e.type==='checkbox'?e.checked:e.dataset.f==='amount'?Number(e.value):e.value});$('#commit')?.addEventListener('click',commit);$('#search')?.addEventListener('input',e=>{query=e.target.value;let start=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(start,start)});$('#categoryFilter')?.addEventListener('change',e=>{filter=e.target.value;render()});$('#editAssets')?.addEventListener('click',editAssets);$('#targets')?.addEventListener('submit',e=>{e.preventDefault();let vals=state.assets.map((_,i)=>Number($('#target'+i).value));if(vals.some(v=>!Number.isFinite(v)||v<0||v>100)||Math.abs(vals.reduce((s,v)=>s+v,0)-100)>.001){$('#targetError').textContent='目標比例合計必須為 100%，每一類須介於 0–100%。';return}vals.forEach((v,i)=>state.assets[i].target=v);save();render();toast('已儲存目標配置')});$('#editGoal')?.addEventListener('click',editGoal);$('#editDebt')?.addEventListener('click',editDebt);$('#chatForm')?.addEventListener('submit',e=>{e.preventDefault();ask($('#question').value)});document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>ask(b.dataset.ask));$('#theme')?.addEventListener('change',e=>{state.theme=e.target.value;save();render()});$('#backup')?.addEventListener('click',()=>download('ledger-backup.json',JSON.stringify({format:'ledger-v1',data:state},null,2),'application/json'));$('#restore')?.addEventListener('click',()=>$('#backupFile').click());$('#fresh')?.addEventListener('click',()=>confirmReset(false));$('#resetDemo')?.addEventListener('click',()=>confirmReset(true));document.querySelectorAll('[data-widget]').forEach(el=>{el.ondragstart=e=>{e.dataTransfer.setData('text/plain',el.dataset.widget);el.classList.add('dragging')};el.ondragend=()=>el.classList.remove('dragging');el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let from=e.dataTransfer.getData('text/plain'),to=el.dataset.widget;if(!state.widgets.includes(from)||from===to)return;state.widgets.splice(state.widgets.indexOf(from),1);state.widgets.splice(state.widgets.indexOf(to),0,from);save();render()}})}
function customize(){let names={net:'淨資產',asset:'總資產',debt:'總負債',income:'本月收入',expense:'本月支出',savings:'儲蓄率',pending:'待繳帳款',goal:'儲蓄目標'};openModal(`<h2>排出你的財務視角。</h2><p class="sub muted">勾選要顯示的模組。桌面可拖拉排序，或使用箭頭調整。</p><div class="checks">${state.widgets.map((k,i)=>`<label><input type="checkbox" data-w="${k}" ${state.hidden.includes(k)?'':'checked'}> ${names[k]} <span style="margin-left:auto"><button class="btn small" data-up="${i}" ${i===0?'disabled':''} aria-label="向上移動${names[k]}">↑</button> <button class="btn small" data-down="${i}" ${i===state.widgets.length-1?'disabled':''} aria-label="向下移動${names[k]}">↓</button></span></label>`).join('')}</div><button class="btn primary" id="saveWidgets">完成</button>`);const sync=()=>{state.hidden=[...$('#modal').querySelectorAll('[data-w]')].filter(e=>!e.checked).map(e=>e.dataset.w)};$('#saveWidgets').onclick=()=>{sync();if(state.hidden.length===state.widgets.length){toast('請至少保留一個模組');return}save();$('#modal').close();render()};$('#modal').querySelectorAll('[data-up],[data-down]').forEach(b=>b.onclick=()=>{sync();let i=Number(b.dataset.up??b.dataset.down),j=i+(b.hasAttribute('data-up')?-1:1);[state.widgets[i],state.widgets[j]]=[state.widgets[j],state.widgets[i]];$('#modal').close();save();render();customize()})}
function sample(){return 'date,description,amount,category\n2026-10-30,範例咖啡,-120,餐飲\n2026-10-29,範例交通,-45,交通\n2026-10-28,範例收入,3000,薪資\n'}
function csvRows(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV 引號未閉合');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function txKey(t){return JSON.stringify([t.date,t.name.trim().normalize('NFKC'),Number(t.amount)])}function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(Date.parse(d))&&new Date(d+'T12:00:00Z').toISOString().slice(0,10)===d}
function parseCSV(txt,name){try{let rows=csvRows(txt.replace(/^\uFEFF/,''));if(rows.length<2)throw Error('CSV 至少要有標題與一筆交易');let headers=rows[0].map(h=>h.trim().toLowerCase()),di=headers.findIndex(h=>['date','日期'].includes(h)),ni=headers.findIndex(h=>['description','摘要','交易摘要'].includes(h)),ai=headers.findIndex(h=>['amount','金額'].includes(h)),ci=headers.findIndex(h=>['category','分類'].includes(h));if([di,ni,ai].some(i=>i<0))throw Error('找不到 date、description、amount 必填欄位');let keys=new Set([...state.transactions,...review].map(txKey)),added=rows.slice(1).map((r,i)=>{let amount=Number((r[ai]||'').replace(/,/g,'')),date=(r[di]||'').trim().replace(/\//g,'-'),nameTx=(r[ni]||'').trim();if(!r[ai]?.trim()||!Number.isFinite(amount)||!validDate(date)||!nameTx)throw Error(`第 ${i+2} 列的日期、摘要或金額不正確`);let cat=categories.includes(r[ci])?r[ci]:/薪|收入/.test(nameTx)?'薪資':/餐|咖啡/.test(nameTx)?'餐飲':/捷運|交通|高鐵/.test(nameTx)?'交通':'生活';let t={id:crypto.randomUUID(),date,name:nameTx,amount,category:cat,source:name,line:i+2};let duplicate=keys.has(txKey(t));keys.add(txKey(t));return {...t,duplicate,keep:!duplicate}});review.push(...added);view='upload';render();toast(`解析 ${added.length} 筆，請覆核後入帳`)}catch(e){toast(e.message)}}
async function handleFiles(files){for(let f of files){if(f.size>5*1024*1024){toast('單檔上限 5 MB');continue}if(!f.name.toLowerCase().endsWith('.csv')){toast(`${f.name}：PDF／圖片 OCR 尚未啟用，檔案未上傳`);continue}parseCSV(await f.text(),f.name)}$('#file').value=''}
function commit(){let selected=review.filter(r=>r.keep);if(!selected.length){toast('請至少勾選一筆交易');return}if(selected.some(r=>!validDate(r.date)||!r.name.trim()||!Number.isFinite(r.amount))){toast('請修正日期、摘要與金額後再入帳');return}const groups={};selected.forEach(r=>{groups[r.source]=(groups[r.source]||0)+1;let {keep,duplicate,...t}=r;state.transactions.push(t)});Object.entries(groups).forEach(([name,count])=>state.imports.unshift({name,count,date:new Date().toLocaleDateString('zh-TW')}));state.month=selected[0].date.slice(0,7);review=[];save();render();toast(`已確認 ${selected.length} 筆交易，儀表板已更新`)}
function download(name,content,type){const u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCSV(rows){const cell=v=>{let s=String(v);if(/^[=+@\t\r]/.test(s)||(/^\-/.test(s)&&!/^\-?\d+(\.\d+)?$/.test(s)))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('ledger-'+state.month+'.csv','\uFEFFdate,description,amount,category,source\r\n'+rows.map(t=>[t.date,t.name,t.amount,t.category,t.source].map(cell).join(',')).join('\r\n'),'text/csv')}
function editTx(id){let t=state.transactions.find(t=>t.id===id)||{date:state.month+'-01',name:'',amount:0,category:'生活'};openModal(`<h2>${id?'編輯':'新增'}交易</h2><form id="txForm"><div class="field"><label>日期</label><input type="date" name="date" value="${esc(t.date)}" required></div><div class="field"><label>摘要</label><input name="name" value="${esc(t.name)}" required maxlength="150"></div><div class="field"><label>金額（收入正數／支出負數）</label><input type="number" step="0.01" name="amount" value="${t.amount}" required></div><div class="field"><label>分類</label><select name="category">${categories.map(c=>`<option ${c===t.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="actions">${cancel}<button class="btn primary">儲存交易</button></div></form>`);$('#txForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),updated={date:f.get('date'),name:f.get('name').trim(),amount:Number(f.get('amount')),category:f.get('category')};if(!updated.name||!validDate(updated.date)||!Number.isFinite(updated.amount)){toast('請輸入有效欄位');return}if(id)Object.assign(t,updated);else state.transactions.push({...updated,id:crypto.randomUUID(),source:'手動新增'});save();$('#modal').close();render();toast('交易已儲存')}}
function editAssets(){openModal(`<h2>更新資產快照</h2><p class="sub muted">輸入換算後的新台幣總額。帳單交易與資產快照分開維護。</p><form id="assetsForm">${state.assets.map((a,i)=>`<div class="field"><label>${esc(a.name)}</label><input name="a${i}" aria-label="${esc(a.name)}金額" type="number" min="0" step="0.01" value="${a.value}" required></div>`).join('')}<div class="actions">${cancel}<button class="btn primary">儲存快照</button></div></form>`);$('#assetsForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),vals=state.assets.map((_,i)=>Number(f.get('a'+i)));if(vals.some(n=>!Number.isFinite(n)||n<0))return;vals.forEach((v,i)=>state.assets[i].value=v);save();$('#modal').close();render();toast('資產快照已更新')}}
function editGoal(){let g=state.goals[0]||{name:'緊急備用金',saved:0,target:240000};openModal(`<h2>設定儲蓄目標</h2><form id="goalForm"><div class="field"><label>目標名稱</label><input name="name" value="${esc(g.name)}" required maxlength="50"></div><div class="field"><label>已存金額</label><input name="saved" type="number" min="0" step="0.01" value="${g.saved}" required></div><div class="field"><label>目標金額</label><input name="target" type="number" min="1" step="0.01" value="${g.target}" required></div><div class="actions">${cancel}<button class="btn primary">儲存目標</button></div></form>`);$('#goalForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),saved=Number(f.get('saved')),target=Number(f.get('target'));if(!name||saved<0||target<=0||![saved,target].every(Number.isFinite))return;state.goals=[{name,saved,target}];save();$('#modal').close();render();toast('目標已更新')}}
function editDebt(){let ds=state.debts.length?state.debts:[{name:'信用卡帳款',balance:0,rate:0,due:'2026-11-10',payment:0}];openModal(`<h2>更新負債資料</h2><form id="debtForm">${ds.map((d,i)=>`<h3>${esc(d.name)}</h3><div class="field"><label>剩餘本金／帳款</label><input name="b${i}" type="number" min="0" step="0.01" value="${d.balance}" required></div><div class="field"><label>本期應繳</label><input name="p${i}" type="number" min="0" step="0.01" value="${d.payment}" required></div><div class="field"><label>到期日</label><input name="d${i}" type="date" value="${esc(d.due)}" required></div>`).join('')}<div class="actions">${cancel}<button class="btn primary">儲存負債</button></div></form>`);$('#debtForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),next=ds.map((d,i)=>({...d,balance:Number(f.get('b'+i)),payment:Number(f.get('p'+i)),due:f.get('d'+i)}));if(next.some(d=>!validDate(d.due)||d.balance<0||d.payment<0||![d.balance,d.payment].every(Number.isFinite)))return;state.debts=next;save();$('#modal').close();render();toast('負債資料已更新')}}
function ask(q){q=q.trim();if(!q)return;let answer;if(/餐飲|吃|飲食/.test(q)){let ts=period().filter(t=>t.category==='餐飲'&&t.amount<0),sum=-ts.reduce((s,t)=>s+t.amount,0);answer=`${state.month} 餐飲支出為 NT$ ${money(sum)}，共 ${ts.length} 筆。\n`+ts.map(t=>`${t.date}｜${t.name}｜NT$ ${money(-t.amount)}\n來源：${t.source}${t.line?' 第 '+t.line+' 列':''}`).join('\n')}else if(/信用卡|應繳|繳款/.test(q)){let ds=state.debts.filter(d=>/信用卡/.test(d.name));answer=ds.length?ds.map(d=>`${d.name}：本期應繳 NT$ ${money(d.payment)}，截止日 ${d.due}。\n依據：負債頁的手動記錄。`).join('\n'):'目前沒有信用卡負債記錄。'}else if(/配置|偏離|平衡/.test(q)){let a=totalAssets();answer='依目前手動資產快照與你的目標比例試算：\n'+state.assets.map(x=>`${x.name}：目前 ${a?(x.value/a*100).toFixed(1):'0'}%／目標 ${x.target}%，差額 NT$ ${money(a*x.target/100-x.value)}`).join('\n')+'\n差額未納入交易成本；可到資產配置頁調整目標。'}else if(/收支|結餘|收入|支出/.test(q)){answer=`${state.month} 收入 NT$ ${money(income())}，支出 NT$ ${money(expense())}，結餘 NT$ ${money(income()-expense())}。\n依據：交易明細中的 ${period().filter(counted).length} 筆收支；轉帳、投資與信用卡繳款不計入生活收支。`}else answer='目前還無法回答這個問題。你可以問餐飲支出、收支結餘、信用卡應繳或配置偏差；生成式 AI 尚未串接。';chats.push({role:'user',text:q},{role:'assistant',text:answer});render();$('#chatlog').scrollTop=$('#chatlog').scrollHeight}
function confirmReset(demo){openModal(`<h2>${demo?'重設示範資料？':'建立空白工作區？'}</h2><p class="sub">這會取代目前工作區。請先匯出備份；此操作無法在工作區內復原。</p><div class="actions"><button class="btn" id="backupFirst">先匯出備份</button>${cancel}<button class="btn danger" id="doReset">確認取代</button></div>`);$('#backupFirst').onclick=()=>download('ledger-backup.json',JSON.stringify({format:'ledger-v1',data:state}),'application/json');$('#doReset').onclick=()=>{let theme=state.theme;state=structuredClone(initial);state.theme=theme;if(!demo){state.demo=false;state.transactions=[];state.assets.forEach(a=>a.value=0);state.debts=[];state.goals=[]}review=[];chats=[];save();$('#modal').close();render();toast('工作區已更新')}}
function validateBackup(x){return x?.format==='ledger-v1'&&x.data&&typeof x.data.demo==='boolean'&&['light','dark'].includes(x.data.theme)&&/^\d{4}-\d{2}$/.test(x.data.month)&&Array.isArray(x.data.transactions)&&x.data.transactions.every(t=>typeof t.id==='string'&&validDate(t.date)&&typeof t.name==='string'&&typeof t.source==='string'&&Number.isFinite(t.amount)&&categories.includes(t.category))&&Array.isArray(x.data.assets)&&x.data.assets.length===4&&x.data.assets.every(a=>typeof a.name==='string'&&Number.isFinite(a.value)&&a.value>=0&&Number.isFinite(a.target)&&a.target>=0&&a.target<=100&&/^#[0-9a-f]{6}$/i.test(a.color))&&Math.abs(x.data.assets.reduce((s,a)=>s+a.target,0)-100)<.001&&Array.isArray(x.data.debts)&&x.data.debts.every(d=>typeof d.name==='string'&&validDate(d.due)&&[d.balance,d.payment,d.rate].every(n=>Number.isFinite(n)&&n>=0))&&Array.isArray(x.data.goals)&&x.data.goals.every(g=>typeof g.name==='string'&&Number.isFinite(g.saved)&&g.saved>=0&&Number.isFinite(g.target)&&g.target>0)&&Array.isArray(x.data.imports)&&x.data.imports.every(i=>typeof i.name==='string'&&Number.isFinite(i.count)&&typeof i.date==='string')&&Array.isArray(x.data.widgets)&&x.data.widgets.length===initial.widgets.length&&new Set(x.data.widgets).size===initial.widgets.length&&x.data.widgets.every(k=>initial.widgets.includes(k))&&Array.isArray(x.data.hidden)&&x.data.hidden.length<initial.widgets.length&&x.data.hidden.every(k=>initial.widgets.includes(k))}
$('#file').onchange=e=>handleFiles(e.target.files);$('#backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>5*1024*1024)throw Error();let x=JSON.parse(await f.text());if(!validateBackup(x))throw Error();openModal('<h2>還原這份備份？</h2><p class="sub">目前資料將被取代。請先備份現有工作區。</p><div class="actions">'+cancel+'<button class="btn primary" id="confirmRestore">確認還原</button></div>');$('#confirmRestore').onclick=()=>{state=x.data;review=[];chats=[];save();$('#modal').close();render();toast('備份已還原')}}catch{toast('無法還原：不是有效的帳見備份，或內容欄位不完整')}e.target.value=''};window.addEventListener('hashchange',()=>{let next=location.hash.slice(1);if(next!==view){view=navs.some(n=>n[0]===next)?next:'dashboard';render()}});render();
</script></body></html>
